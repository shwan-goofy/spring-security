spring.application.name=hs-spring-security

# Server Configuration
server.port=8080

# Spring Security Logging
# FilterChainProxy \uC0C1\uC138 \uB85C\uADF8 - \uAC01 \uC694\uCCAD\uB9C8\uB2E4 \uC2E4\uD589\uB418\uB294 \uD544\uD130 \uCCB4\uC778 \uCD9C\uB825
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Spring Security \uC804\uBC18 \uB514\uBC84\uADF8 \uB85C\uADF8
# \uC778\uC99D, \uC778\uAC00, \uD544\uD130 \uC2E4\uD589 \uACFC\uC815 \uC0C1\uC138 \uCD9C\uB825
logging.level.org.springframework.security=DEBUG

# Web \uC694\uCCAD \uB85C\uADF8 (\uC120\uD0DD\uC0AC\uD56D)
# logging.level.org.springframework.web=DEBUG

# \uD559\uC2B5 \uBAA9\uC801\uC73C\uB85C \uC0AC\uC6A9\uD558\uB294 \uB85C\uADF8 \uC124\uC815:
# - FilterChainProxy: \uC5B4\uB5A4 SecurityFilterChain\uC774 \uC120\uD0DD\uB418\uB294\uC9C0 \uD655\uC778
# - \uAC01 \uD544\uD130\uC758 \uC2E4\uD589 \uC21C\uC11C\uC640 \uACB0\uACFC \uD655\uC778
# - \uC778\uC99D \uC131\uACF5/\uC2E4\uD328 \uACFC\uC815 \uD655\uC778
# - SecurityContext \uC800\uC7A5/\uB85C\uB4DC \uD655\uC778

# \uC6B4\uC601 \uD658\uACBD\uC5D0\uC11C\uB294 INFO \uB610\uB294 WARN \uB808\uBCA8\uB85C \uBCC0\uACBD \uAD8C\uC7A5
# logging.level.org.springframework.security=INFO
